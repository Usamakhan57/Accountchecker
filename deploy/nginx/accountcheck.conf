# AccountCheck - Nginx site configuration
#
# Copy to /etc/nginx/sites-available/accountcheck, replace every
# REPLACE_ME value, then:
#
#   sudo ln -s /etc/nginx/sites-available/accountcheck /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file configures ONE site. It does not touch nginx.conf, does not
# disable another site, and does not define anything global. Adding it cannot
# affect anything else the server is hosting.
#
# The app and the API are served from one origin on purpose. The session
# cookie is HttpOnly with SameSite=Lax, so a genuinely cross-site API would not
# receive it on a reload and the app would appear to sign the user out.
# One origin also leaves CORS out of it entirely.

# ---------------------------------------------------------------------------
# Port 80: ACME challenges, and a redirect for everything else.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_ME_DOMAIN;

    # Certbot writes its challenge here. It must stay reachable over plain
    # HTTP or renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443: the application.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name REPLACE_ME_DOMAIN;

    # Certbot fills these in; see docs/DEPLOYMENT.md.
    ssl_certificate     /etc/letsencrypt/live/REPLACE_ME_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_ME_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The built SPA. Only frontend/dist is ever exposed.
    root /var/www/accountcheck/frontend/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 8m;          # above UPLOAD_MAX_BYTES, with headroom

    access_log /var/log/nginx/accountcheck-access.log;
    error_log  /var/log/nginx/accountcheck-error.log;

    # Nginx's version is not useful to a visitor and is useful to a scanner.
    server_tokens off;

    # HSTS. Add this only once HTTPS is working and you intend to keep it:
    # a browser that has seen it will refuse plain HTTP for this host until it
    # expires, and there is no way to take that back early.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Baseline headers for the HTML the SPA is served from. The API sets its
    # own on every response; these cover the static document.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;

    # The app loads nothing from another origin: scripts, styles and fonts are
    # all served from here. 'unsafe-inline' for styles is what Vite's injected
    # critical CSS needs; nothing else is relaxed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;

    # -----------------------------------------------------------------------
    # The API.
    #
    # This block MUST come before `location /`. Otherwise the SPA fallback
    # answers /api too and every endpoint returns index.html with a 200.
    # -----------------------------------------------------------------------
    location /api {
        # One front controller handles every route; there is no other
        # executable path under backend/.
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm-accountcheck.sock;

        # The front controller lives outside the document root, so the path is
        # given explicitly rather than derived from it.
        fastcgi_param SCRIPT_FILENAME /var/www/accountcheck/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/accountcheck/backend/public;

        # A 5,000-record job returns immediately - the worker does the work -
        # so nothing here should take anywhere near this long. It is a ceiling,
        # not an expectation.
        fastcgi_read_timeout 60s;

        fastcgi_hide_header X-Powered-By;
    }

    # Nothing else is PHP. Without this, any other .php path that somehow
    # appeared under the document root would be executed.
    location ~ \.php$ {
        return 404;
    }

    # -----------------------------------------------------------------------
    # Static assets.
    # -----------------------------------------------------------------------

    # Vite writes content-hashed filenames, so a change is a new URL and these
    # can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html is NOT cached. It is what points at the hashed assets, so a
    # stale copy would load a deploy's worth of files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # The SPA fallback. Any path the router owns returns index.html.
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A dotfile under the document root is either a mistake or an attack.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
