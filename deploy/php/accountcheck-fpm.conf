; AccountCheck PHP-FPM pool.
;
;   sudo cp accountcheck-fpm.conf /etc/php/8.2/fpm/pool.d/accountcheck.conf
;   sudo systemctl reload php8.2-fpm
;
; A pool of its own, with its own socket. The default `www` pool is left
; untouched, so anything else on this server keeps running exactly as it was.

[accountcheck]

user = www-data
group = www-data

listen = /run/php/php8.2-fpm-accountcheck.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle a worker periodically so a leak in any dependency is bounded.
pm.max_requests = 500

; Requests are short by design: a batch is queued, never processed inline.
; Anything past this is a bug, and it should be cut off rather than tie up a
; worker.
request_terminate_timeout = 60s

; Errors go to the log, never to the response.
php_admin_value[error_log] = /var/log/php8.2-fpm-accountcheck.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off

; Above UPLOAD_MAX_BYTES with headroom for the multipart envelope.
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 10M
php_admin_value[memory_limit] = 256M

; PHP may only read and write inside the application and its own temp dir.
; A path traversal that got past the application still cannot reach /etc.
php_admin_value[open_basedir] = /var/www/accountcheck/backend:/tmp
php_admin_value[expose_php] = off

; Nothing in this application shells out.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen

; Opcache: the code does not change between deploys, and the deploy script
; reloads FPM, so revalidation is wasted work.
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.max_accelerated_files] = 10000
